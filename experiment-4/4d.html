<!DOCTYPE html>
<html>
<head>
    <title>Pseudo-element Selector</title>
    <style>
        p::first-letter {
            color: red;
            font-size: 35px;
            font-weight: bold;
        }
        p::first-line {
            background-color: yellow;
        }
        h1::before {
            content: "★ ";
            color: blue;
        }
        h1::after {
            content: " ★";
            color: green;
        }
    </style>
</head>
<body>
    <h1>Pseudo-element Selector</h1>
    <p>
        This paragraph demonstrates the use of pseudo-element selectors.
        CSS can style a specific part of an HTML element.
    </p>
</body>
</html>
