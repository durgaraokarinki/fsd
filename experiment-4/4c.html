<!DOCTYPE html>
<html>
<head>
    <title>Pseudo-class Selector</title>
    <style>
        a:hover {
            color: red;
            background-color: yellow;
        }
        button:hover {
            background-color: green;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Pseudo-class Selector</h1>
    <a href="#">Move the mouse over this link</a>
    <br><br>
    <button>Move Mouse Over Button</button>
</body>
</html>
