<!DOCTYPE html>
<html>
<head>
    <title>Combinator Selectors</title>
    <style>
        div p {
            color: blue;
        }
        div > h2 {
            color: red;
        }
        h3 + p {
            background-color: yellow;
        }
        h4 ~ p {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>CSS Combinator Selectors</h1>
    <div>
        <h2>Child Selector</h2>
        <p>This is a descendant paragraph.</p>
        <p>This is another descendant paragraph.</p>
        <h3>Adjacent Sibling Selector</h3>
        <p>This paragraph is immediately after h3.</p>
        <h4>General Sibling Selector</h4>
        <p>This is a general sibling paragraph.</p>
        <p>This is another general sibling paragraph.</p>
    </div>
</body>
</html>
