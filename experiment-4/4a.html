<!DOCTYPE html>
<html>
<head>
    <title>CSS Simple Selectors</title>
    <style>
        p {
            color: blue;
            font-size: 18px;
        }
       #heading {
            color: red;
            text-align: center;
        }
        .highlight {
            background-color: yellow;
            font-weight: bold;
        }
        h2, h3 {
            color: green;
        }
        * {
            font-family: Arial;
        }
    </style>
</head>
<body>
  <h1 id="heading">CSS Simple Selectors</h1>
    <p>This paragraph uses an element selector.</p>
    <p class="highlight">This paragraph uses a class selector.</p>
    <h2>Group Selector Heading 2</h2>
    <h3>Group Selector Heading 3</h3>
    <p>CSS selectors are used to apply styles to HTML elements.</p>
</body>
</html>
